[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pauli-transforms"
version = "0.1.0"
description = "Coordinate transforms for permutation-invariant qubit operators"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Lennart Sauer"}]
dependencies = ["numpy>=2", "scipy>=1.12"]

[project.optional-dependencies]
benchmarks = ["matplotlib>=3.7", "threadpoolctl>=3.1"]

[tool.setuptools.packages.find]
include = ["pauli_transforms*"]
