[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pauli-transforms"
version = "0.2.0"
description = "Coordinate transforms for permutation-invariant qubit operators"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Lennart Sauer"}]
dependencies = ["numpy>=2", "scipy>=1.12"]

[project.optional-dependencies]
benchmarks = ["matplotlib>=3.7", "threadpoolctl>=3.1"]
permqit = ["permqit @ git+https://github.com/bbbergh/permqit.git@22af3cd245bd0e950df49f6ce16ccd422b6eb2c5"]

[tool.setuptools.packages.find]
include = ["pauli_transforms*"]
